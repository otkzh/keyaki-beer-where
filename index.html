<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#ff5a82">
  <title>けやきビール祭り｜いまここ</title>
  <meta name="description" content="2026けやきひろば秋のビール祭りの会場図に、待ち合わせ位置を表示するスマホ用アプリです。">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect rx='14' width='64' height='64' fill='%23ff5a82'/%3E%3Cpath d='M23 13h20v34a8 8 0 0 1-8 8h-4a8 8 0 0 1-8-8z' fill='%23ffd84d'/%3E%3Cpath d='M43 21h5a8 8 0 0 1 0 16h-5' fill='none' stroke='white' stroke-width='5'/%3E%3Cpath d='M20 10h26' stroke='white' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
  <meta property="og:title" content="けやきビール祭り｜いまここ">
  <meta property="og:description" content="会場図に待ち合わせ位置を表示し、QR付き画像を作れます。">
  <style>
    :root{--pink:#f0527b;--ink:#20201d;--cream:#fffdf3;--green:#13924b;--line:#e9e3d7}
    *{box-sizing:border-box} html,body{margin:0;min-height:100%;background:#f7f3e8;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif}
    body{padding:max(10px,env(safe-area-inset-top)) 10px max(18px,env(safe-area-inset-bottom));background-image:radial-gradient(#e7dfca 1px,transparent 1px);background-size:16px 16px}
    .app{width:min(100%,520px);margin:auto}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:3px 3px 10px}
    h1{font-size:clamp(22px,6vw,30px);line-height:1;margin:0;letter-spacing:-.04em}.sub{font-size:12px;font-weight:800;color:var(--pink);margin-top:5px}.status{font-size:11px;text-align:right;color:#625f58;line-height:1.35}
    .map-card{position:relative;background:white;border:2px solid var(--ink);border-radius:20px;overflow:hidden;box-shadow:5px 6px 0 var(--ink);touch-action:none}
    .map-layer{position:relative;transform-origin:50% 50%}.map-card img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
    .pin{position:absolute;left:50%;top:48%;width:0;height:0;transform:scale(var(--inverse-zoom,1));transform-origin:0 0;pointer-events:none;z-index:3;transition:left .25s ease,top .25s ease}
    .bubble{position:absolute;left:50%;top:48%;transform:translate(-50%,10px);z-index:4;pointer-events:none;background:var(--ink);color:white;border-radius:10px;padding:6px 10px;font-size:13px;font-weight:900;white-space:nowrap;box-shadow:0 2px 0 #fff;transition:left .25s ease,top .25s ease}
    .accuracy{position:absolute;display:none;border:2px solid #2689e5aa;background:#4ea8ff2e;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:2}
    .zoom-tools{position:absolute;right:9px;top:9px;z-index:7;display:grid;gap:5px}.zoom-tools button{width:39px;height:39px;border:2px solid var(--ink);border-radius:11px;background:#fffffff0;color:var(--ink);font:900 24px/1 inherit;box-shadow:2px 2px 0 var(--ink);padding:0}.zoom-tools button:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}.zoom-level{background:#20201de8;color:white;border-radius:8px;padding:4px 2px;text-align:center;font-size:10px;font-weight:900}
    .controls{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}.controls button{min-height:51px;border:2px solid var(--ink);border-radius:14px;background:white;color:var(--ink);font:800 15px/1.15 inherit;box-shadow:3px 3px 0 var(--ink);padding:9px;cursor:pointer}.controls button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}.controls button:disabled{opacity:.65;cursor:wait}
    #locate{background:var(--green);color:white}.wide{grid-column:1/-1;background:var(--pink)!important;color:white!important}
    .field{display:flex;align-items:center;gap:8px;margin:11px 2px 0;font-size:13px;font-weight:800}.field span{flex:none}.field input{flex:1;min-width:0;min-height:44px;border:2px solid var(--ink);border-radius:12px;padding:0 12px;font:700 15px inherit;background:white}
    .note{margin:12px 3px 0;font-size:11px;line-height:1.55;color:#68645c}.note a{color:inherit}.toast{position:fixed;left:50%;bottom:max(25px,env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#20201deb;color:white;padding:10px 14px;border-radius:99px;font-size:13px;font-weight:800;opacity:0;transition:.2s;z-index:20;white-space:nowrap;max-width:calc(100vw - 24px);text-align:center}.toast.on{opacity:1;transform:translate(-50%,0)}
    .pin svg{position:absolute;bottom:0;left:0;width:var(--marker-size,42px);height:auto;transform:translateX(-50%);overflow:visible;filter:drop-shadow(0 2px 1px #0005)}
    .pin .cross-symbol{display:none;transform:translate(-50%,50%)}
    .pin.is-cross .pin-symbol{display:none}.pin.is-cross .cross-symbol{display:block}
    .bubble{transform:translate(-50%,calc(var(--label-gap,10px) * var(--inverse-zoom,1))) scale(var(--inverse-zoom,1));transform-origin:50% 0}
    .marker-settings{margin:12px 2px 0;padding:10px 12px;border:2px solid var(--ink);border-radius:12px;background:white;min-width:0;font-size:14px}
    .marker-settings legend{font-weight:800;padding:0 5px}.marker-shapes{display:flex;gap:24px}.marker-shapes label{display:flex;align-items:center;min-height:36px;gap:5px}
    .marker-settings input{accent-color:var(--pink)}.marker-size{display:flex;align-items:center;gap:8px;margin-top:4px}.marker-size input{flex:1;min-width:50px;height:36px}.marker-size output{min-width:42px;text-align:right;font-variant-numeric:tabular-nums}
    .shot-dialog{width:min(94vw,640px);max-height:calc(100dvh - 24px);padding:0;border:2px solid var(--ink);border-radius:18px;background:var(--cream);box-shadow:6px 7px 0 var(--ink);color:var(--ink)}
    .shot-dialog::backdrop{background:#20201dcc}.shot-dialog header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 15px;border-bottom:1px solid var(--line)}.shot-dialog h2{margin:0;font-size:17px}.shot-dialog header button{border:0;background:transparent;font-size:27px;line-height:1;cursor:pointer}
    .shot-preview{display:block;max-width:100%;max-height:calc(100dvh - 150px);margin:10px auto;object-fit:contain;background:white;border:1px solid var(--line)}.shot-actions{display:flex;gap:8px;padding:0 14px 14px}.shot-actions a,.shot-actions button{flex:1;min-height:44px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:11px;background:var(--pink);color:white;font:800 14px inherit;text-decoration:none;cursor:pointer}.shot-actions button{background:var(--green)}.shot-actions [hidden]{display:none}
    @media (orientation:landscape) and (max-height:700px){
      body{padding:max(7px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(7px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
      .app{width:min(100%,800px);display:grid;grid-template-columns:minmax(0,1fr) minmax(255px,315px);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"head head" "map panel";column-gap:13px;row-gap:9px;align-items:start}
      .head{grid-area:head;margin:0 2px}.head h1{font-size:22px}.sub{font-size:11px}
      .map-card{grid-area:map;justify-self:end;width:min(100%,calc((100dvh - 77px)*.842));max-height:calc(100dvh - 77px);aspect-ratio:907.087/1077.17;border-radius:14px}.map-card img{height:auto}
      .side-panel{grid-area:panel;max-height:calc(100dvh - 77px);overflow-y:auto;padding:0 4px 12px 1px;scrollbar-width:thin}.field{margin:0}.controls{margin-top:8px}.controls button{min-height:42px;font-size:13px}.marker-settings{margin-top:10px;padding:7px 10px}.marker-shapes label{min-height:28px}.marker-size input{height:28px}.note{margin-top:9px}
    }
    @media (max-width:350px){.controls button{font-size:13px}.status{font-size:10px}.sub{font-size:11px}}
  </style>
</head>
<body>
<main class="app">
  <header class="head">
    <div><h1>🍺 いまここ</h1><div class="sub">待ち合わせマップ</div></div>
    <div class="status"><b id="clock">--:--</b><br><span id="status">地図をタップ</span></div>
  </header>
  <section class="map-card" id="map" aria-label="会場図。タップすると現在地マーカーを移動できます">
    <div class="map-layer" id="mapLayer">
      <img src="2026autumn-vector.svg" alt="2026けやきひろば秋のビール祭り会場図（添付PDFから変換したベクター版）">
      <div class="accuracy" id="accuracy"></div>
      <div class="pin" id="pin">
        <svg class="pin-symbol" viewBox="0 0 48 60" aria-hidden="true"><path d="M24 58C20 50 3 34 3 23a21 21 0 0 1 42 0c0 11-17 27-21 35Z" fill="var(--pink)" stroke="white" stroke-width="3"/><circle cx="24" cy="23" r="7" fill="white"/></svg>
        <svg class="cross-symbol" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 4V44M4 24H44" fill="none" stroke="white" stroke-width="9"/><path d="M24 4V44M4 24H44" fill="none" stroke="var(--pink)" stroke-width="5"/></svg>
      </div>
      <div class="bubble" id="bubble">ここにいます</div>
    </div>
    <div class="zoom-tools" aria-label="地図の拡大縮小"><button id="zoomIn" aria-label="拡大">＋</button><button id="zoomOut" aria-label="縮小">−</button><div class="zoom-level" id="zoomLevel">100%</div></div>
  </section>
  <div class="side-panel">
    <label class="field"><span>メッセージ</span><input id="label" maxlength="24" value="ここにいます"></label>
    <div class="controls">
      <button class="wide" id="shot">QR付き画像を作る</button>
      <button id="locate">現在地を取得</button><button id="center">中央に戻す</button>
    </div>
    <fieldset class="marker-settings">
      <legend>マーカー</legend>
      <div class="marker-shapes"><label><input type="radio" name="markerShape" value="pin" checked> ピン</label><label><input type="radio" name="markerShape" value="cross"> 十字 ＋</label></div>
      <label class="marker-size" for="markerSize">大きさ <input type="range" id="markerSize" min="20" max="72" step="2" value="42"><output id="markerSizeValue" for="markerSize">42px</output></label>
    </fieldset>
    <p class="note">GPSは概算です。取得後は実際の位置にピンを合わせてください。会場図：<a href="https://www.beerkeyaki.jp/map/" target="_blank" rel="noopener">けやきひろばビール祭り公式サイト</a></p>
  </div>
</main>
<dialog class="shot-dialog" id="shotDialog" aria-labelledby="shotTitle">
  <header><h2 id="shotTitle">プレビュー</h2><button id="closeShot" aria-label="閉じる">×</button></header>
  <img class="shot-preview" id="shotPreview" alt="地図と現在地、ページのQRコードを含むスクリーンショット">
  <div class="shot-actions"><a id="downloadShot" download="keyaki-imakoko.png">保存</a><button id="shareShot" hidden>共有</button></div>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{
  const map=document.querySelector('#map'),layer=document.querySelector('#mapLayer'),pin=document.querySelector('#pin'),bubble=document.querySelector('#bubble'),acc=document.querySelector('#accuracy');
  const status=document.querySelector('#status'),label=document.querySelector('#label'),toast=document.querySelector('#toast');
  let pos=JSON.parse(localStorage.getItem('keyaki-pin')||'null')||{x:.5,y:.48};
  // Approximate outdoor bounds of the illustrated venue. Manual correction is intentionally primary.
  const bounds={north:35.89502,south:35.89322,west:139.62947,east:139.63120};
  function setPos(x,y,save=true){pos={x:Math.max(.025,Math.min(.975,x)),y:Math.max(.12,Math.min(.94,y))};pin.style.left=bubble.style.left=(pos.x*100)+'%';pin.style.top=bubble.style.top=(pos.y*100)+'%';if(save)localStorage.setItem('keyaki-pin',JSON.stringify(pos));}
  function say(t){toast.textContent=t;toast.classList.add('on');clearTimeout(say.t);say.t=setTimeout(()=>toast.classList.remove('on'),1800)}
  function clock(){const d=new Date;document.querySelector('#clock').textContent=d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})} clock();setInterval(clock,30000);setPos(pos.x,pos.y,false);
  let view={scale:1,tx:0,ty:0},pointers=new Map(),gesture=null;
  const sizeInput=document.querySelector('#markerSize'),sizeOutput=document.querySelector('#markerSizeValue');
  let markerSize=42,markerShape='pin';
  try{const savedSize=Number(localStorage.getItem('keyaki-marker-size'));if(savedSize>=20&&savedSize<=72)markerSize=savedSize;markerShape=localStorage.getItem('keyaki-marker-shape')==='cross'?'cross':'pin'}catch{}
  function applyMarker(){
    layer.style.setProperty('--marker-size',markerSize+'px');
    layer.style.setProperty('--label-gap',(markerShape==='cross'?markerSize/2+8:10)+'px');
    pin.classList.toggle('is-cross',markerShape==='cross');
    sizeInput.value=markerSize;sizeOutput.textContent=markerSize+'px';
    document.querySelectorAll('[name="markerShape"]').forEach(r=>r.checked=r.value===markerShape);
  }
  sizeInput.addEventListener('input',()=>{markerSize=Number(sizeInput.value);applyMarker();try{localStorage.setItem('keyaki-marker-size',markerSize)}catch{}});
  document.querySelectorAll('[name="markerShape"]').forEach(r=>r.addEventListener('change',()=>{markerShape=r.value;applyMarker();try{localStorage.setItem('keyaki-marker-shape',markerShape)}catch{}}));
  applyMarker();
  function applyView(){
    const maxX=map.clientWidth*(view.scale-1)/2,maxY=map.clientHeight*(view.scale-1)/2;
    view.tx=Math.max(-maxX,Math.min(maxX,view.tx));view.ty=Math.max(-maxY,Math.min(maxY,view.ty));
    layer.style.transform=`translate(${view.tx}px,${view.ty}px) scale(${view.scale})`;
    layer.style.setProperty('--inverse-zoom',1/view.scale);
    document.querySelector('#zoomLevel').textContent=Math.round(view.scale*100)+'%';
  }
  function zoomTo(next){view.scale=Math.max(1,Math.min(4,next));if(view.scale===1)view.tx=view.ty=0;applyView()}
  document.querySelector('#zoomIn').onclick=e=>{e.stopPropagation();zoomTo(view.scale+.5)};
  document.querySelector('#zoomOut').onclick=e=>{e.stopPropagation();zoomTo(view.scale-.5)};
  map.addEventListener('wheel',e=>{e.preventDefault();zoomTo(view.scale+(e.deltaY<0 ? .25 : -.25))},{passive:false});
  map.addEventListener('pointerdown',e=>{
    if(e.target.closest('.zoom-tools'))return;e.preventDefault();map.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY});
    if(pointers.size===1)gesture={tx:view.tx,ty:view.ty,moved:false};
    if(pointers.size===2){const a=[...pointers.values()];gesture={distance:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),scale:view.scale,tx:view.tx,ty:view.ty,moved:true}}
  });
  map.addEventListener('pointermove',e=>{
    const p=pointers.get(e.pointerId);if(!p)return;p.x=e.clientX;p.y=e.clientY;
    if(pointers.size===2){const a=[...pointers.values()];view.scale=Math.max(1,Math.min(4,gesture.scale*Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)/gesture.distance));applyView();return}
    if(pointers.size===1&&view.scale>1){const dx=p.x-p.sx,dy=p.y-p.sy;if(Math.hypot(dx,dy)>5)gesture.moved=true;view.tx=gesture.tx+dx;view.ty=gesture.ty+dy;applyView()}
  });
  function endPointer(e){
    const p=pointers.get(e.pointerId);if(!p)return;const wasTap=pointers.size===1&&!gesture?.moved&&Math.hypot(p.x-p.sx,p.y-p.sy)<8;pointers.delete(e.pointerId);
    if(wasTap){const r=layer.getBoundingClientRect();setPos((e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height);acc.style.display='none';status.textContent='手動で指定';navigator.vibrate?.(25)}
    if(pointers.size===1){const left=[...pointers.values()][0];left.sx=left.x;left.sy=left.y;gesture={tx:view.tx,ty:view.ty,moved:true}}
  }
  map.addEventListener('pointerup',endPointer);map.addEventListener('pointercancel',endPointer);
  label.addEventListener('input',()=>{bubble.textContent=label.value.trim()||'ここにいます';localStorage.setItem('keyaki-label',bubble.textContent)});
  const saved=localStorage.getItem('keyaki-label');if(saved){label.value=bubble.textContent=saved}
  document.querySelector('#center').onclick=()=>{setPos(.5,.48);acc.style.display='none';view={scale:1,tx:0,ty:0};applyView();status.textContent='中央に戻しました'};
  document.querySelector('#locate').onclick=()=>{
    if(!navigator.geolocation){say('この端末では位置情報を使えません');return}
    status.textContent='位置情報を取得中…';
    navigator.geolocation.getCurrentPosition(p=>{
      const {latitude:lat,longitude:lon,accuracy}=p.coords;
      const x=(lon-bounds.west)/(bounds.east-bounds.west),y=(bounds.north-lat)/(bounds.north-bounds.south);
      setPos(x,y);
      const meters=Math.max(accuracy,8),w=Math.min(layer.clientWidth*.6,meters/155*layer.clientWidth);
      acc.style.cssText=`display:block;left:${pos.x*100}%;top:${pos.y*100}%;width:${w}px;height:${w}px`;
      status.textContent=`GPS誤差 約${Math.round(accuracy)}m`;
      if(x<0||x>1||y<.1||y>1)say('会場外を指しています。手動で補正してください');else say('現在地を表示しました');
    },err=>{status.textContent='位置情報を取得できません';say(err.code===1?'位置情報の利用を許可してください':'GPSを受信できません')},{enableHighAccuracy:true,timeout:12000,maximumAge:5000});
  };
  const mapImage=layer.querySelector('img'),qrImage=new Image(),shotButton=document.querySelector('#shot');
  const shotDialog=document.querySelector('#shotDialog'),shotPreview=document.querySelector('#shotPreview');
  const downloadShot=document.querySelector('#downloadShot'),shareShot=document.querySelector('#shareShot');
  const shareUrl='https://otkzh.github.io/keyaki-beer-where/';
  qrImage.src='share-qr.svg';
  let shotObjectUrl=null,shotFile=null;
  function roundedRect(ctx,x,y,w,h,r){
    r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
  }
  function drawMarker(ctx,x,y,size){
    ctx.save();ctx.shadowColor='#0005';ctx.shadowBlur=size*.07;ctx.shadowOffsetY=size*.05;
    if(markerShape==='cross'){
      ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,y-size*.42);ctx.lineTo(x,y+size*.42);ctx.moveTo(x-size*.42,y);ctx.lineTo(x+size*.42,y);
      ctx.strokeStyle='white';ctx.lineWidth=size*.19;ctx.stroke();ctx.strokeStyle='#f0527b';ctx.lineWidth=size*.105;ctx.stroke();
    }else{
      ctx.translate(x-size/2,y-size*60/48);ctx.scale(size/48,size/48);
      const shape=new Path2D('M24 58C20 50 3 34 3 23a21 21 0 0 1 42 0c0 11-17 27-21 35Z');
      ctx.fillStyle='#f0527b';ctx.strokeStyle='white';ctx.lineWidth=3;ctx.fill(shape);ctx.stroke(shape);
      ctx.shadowColor='transparent';ctx.beginPath();ctx.arc(24,23,7,0,Math.PI*2);ctx.fillStyle='white';ctx.fill();
    }
    ctx.restore();
  }
  async function makeScreenshot(){
    await Promise.all([mapImage.decode(),qrImage.decode()]);
    const mapRect=map.getBoundingClientRect(),imageRect=mapImage.getBoundingClientRect();
    if(!mapRect.width||!mapRect.height)throw new Error('地図を表示できません');
    const width=1200,scale=width/mapRect.width,top=90,mapHeight=Math.round(mapRect.height*scale),footer=210;
    const canvas=document.createElement('canvas');canvas.width=width;canvas.height=top+mapHeight+footer;
    const ctx=canvas.getContext('2d');if(!ctx)throw new Error('画像を作成できません');
    ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#20201d';ctx.font='900 54px -apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif';ctx.fillText('いまここ',38,64,width-76);
    ctx.save();ctx.beginPath();ctx.rect(0,top,width,mapHeight);ctx.clip();
    ctx.fillStyle='white';ctx.fillRect(0,top,width,mapHeight);
    ctx.drawImage(mapImage,(imageRect.left-mapRect.left)*scale,top+(imageRect.top-mapRect.top)*scale,imageRect.width*scale,imageRect.height*scale);
    if(acc.style.display!=='none'){
      const r=acc.getBoundingClientRect();ctx.beginPath();ctx.ellipse((r.left+r.width/2-mapRect.left)*scale,top+(r.top+r.height/2-mapRect.top)*scale,r.width*scale/2,r.height*scale/2,0,0,Math.PI*2);
      ctx.fillStyle='#4ea8ff2e';ctx.strokeStyle='#2689e5aa';ctx.lineWidth=2*scale;ctx.fill();ctx.stroke();
    }
    const x=(imageRect.left+imageRect.width*pos.x-mapRect.left)*scale;
    const y=top+(imageRect.top+imageRect.height*pos.y-mapRect.top)*scale;
    drawMarker(ctx,x,y,markerSize*scale);
    const b=bubble.getBoundingClientRect(),bx=(b.left-mapRect.left)*scale,by=top+(b.top-mapRect.top)*scale,bw=b.width*scale,bh=b.height*scale;
    roundedRect(ctx,bx,by,bw,bh,10*scale);ctx.fillStyle='#20201d';ctx.fill();
    ctx.fillStyle='white';ctx.font=`900 ${13*scale}px -apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(bubble.textContent,bx+bw/2,by+bh/2,bw-16*scale);
    ctx.restore();
    ctx.fillStyle='#fffdf3';ctx.fillRect(0,top+mapHeight,width,footer);
    ctx.fillStyle='#20201d';ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.font='900 42px -apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif';ctx.fillText('この地図を開く',40,top+mapHeight+75);
    ctx.font='30px -apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif';ctx.fillText(shareUrl,40,top+mapHeight+133,width-260);
    ctx.drawImage(qrImage,width-194,top+mapHeight+18,170,170);
    return new Promise((resolve,reject)=>canvas.toBlob(blob=>blob?resolve(blob):reject(new Error('画像を保存できません')),'image/png'));
  }
  shotButton.onclick=async()=>{
    shotButton.disabled=true;shotButton.textContent='作成中…';
    try{
      const blob=await makeScreenshot(),now=new Date();
      if(shotObjectUrl)URL.revokeObjectURL(shotObjectUrl);
      shotObjectUrl=URL.createObjectURL(blob);
      const stamp=[now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('')+'-'+[now.getHours(),now.getMinutes()].map(n=>String(n).padStart(2,'0')).join('');
      shotFile=new File([blob],`keyaki-imakoko-${stamp}.png`,{type:'image/png'});
      shotPreview.src=shotObjectUrl;downloadShot.href=shotObjectUrl;downloadShot.download=shotFile.name;
      shareShot.hidden=!navigator.canShare?.({files:[shotFile]});
      shotDialog.showModal();
    }catch(err){console.error(err);say('画像を作れませんでした。もう一度お試しください')}
    finally{shotButton.disabled=false;shotButton.textContent='QR付き画像を作る'}
  };
  shareShot.onclick=async()=>{if(!shotFile)return;try{await navigator.share({files:[shotFile],title:'けやきビール祭り｜いまここ'})}catch(err){if(err.name!=='AbortError')say('共有できませんでした')}};
  document.querySelector('#closeShot').onclick=()=>shotDialog.close();
  shotDialog.onclick=e=>{if(e.target===shotDialog)shotDialog.close()};
  shotDialog.addEventListener('close',()=>{shotPreview.removeAttribute('src');downloadShot.removeAttribute('href');if(shotObjectUrl)URL.revokeObjectURL(shotObjectUrl);shotObjectUrl=null;shotFile=null});
  window.addEventListener('resize',applyView);
  applyView();
})();
</script>
</body>
</html>
