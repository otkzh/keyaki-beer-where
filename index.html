<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#c65b47">
  <title>けやきビール祭り｜いまここ</title>
  <meta name="description" content="2026けやきひろば秋のビール祭りの会場図に、待ち合わせ位置を表示するスマホ用アプリです。">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23c65b47'/%3E%3Cpath d='M23 13h20v34a8 8 0 0 1-8 8h-4a8 8 0 0 1-8-8z' fill='%23ffd84d'/%3E%3Cpath d='M43 21h5a8 8 0 0 1 0 16h-5' fill='none' stroke='white' stroke-width='5'/%3E%3Cpath d='M20 10h26' stroke='white' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
  <meta property="og:title" content="けやきビール祭り｜いまここ">
  <meta property="og:description" content="会場図に待ち合わせ位置を表示し、画像を作れます。">
  <link rel="stylesheet" href="style.css?v=11">
</head>
<body>
<main class="app">
  <header class="head">
    <div class="brand"><h1>🍺 いまここ</h1><div class="sub">待ち合わせマップ</div></div>
    <time id="clock">--:--</time>
    <div class="header-actions" aria-label="操作">
      <button id="priceMode" class="mode-button" aria-label="ビールの銘柄と価格を見る" aria-pressed="false" title="ビールの銘柄と価格を見る"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h13l-1 13H5L4 7Z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M17 9h3a2 2 0 0 1 0 4h-3M3 6c0-2 3-3 4-1 2-2 4-1 5 0 2-1 5 0 5 2H4" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
      <button id="reset" aria-label="地図とマーカーをリセット" title="地図とマーカーをリセット">↺</button>
      <button id="shot" aria-label="共有用の画像を作る" title="共有用の画像を作る"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3m0 0L8 7m4-4 4 4M5 13v7h14v-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"/></svg></button>
    </div>
  </header>
  <div class="region-selector" id="regionSelector" hidden><label for="regionSelect">地域で絞る</label><select id="regionSelect"><option value="">すべての地域</option></select></div>
  <section class="map-card" id="map" aria-label="会場図。タップすると待ち合わせ位置のマーカーを移動できます">
    <div class="map-layer" id="mapLayer">
      <img src="2026autumn-vector.svg" alt="2026けやきひろば秋のビール祭り会場図（添付PDFから変換したベクター版）">
      <button class="pin is-drop" id="pin" type="button" aria-label="ドロップのマーカー。タップで十字に切り替え" title="タップでマーカーを切り替え">
        <svg class="drop-symbol" viewBox="0 0 48 60" aria-hidden="true"><path d="M24 58C20 50 3 34 3 23a21 21 0 0 1 42 0c0 11-17 27-21 35Z" fill="var(--accent)" stroke="white" stroke-width="3"/><circle cx="24" cy="23" r="7" fill="white"/></svg>
        <svg class="cross-symbol" viewBox="0 0 48 48" aria-hidden="true" hidden><path d="M24 4V44M4 24H44" fill="none" stroke="white" stroke-width="9"/><path d="M24 4V44M4 24H44" fill="none" stroke="#f0527b" stroke-width="5"/></svg>
      </button>
      <div class="bubble" id="bubble">ここにいます</div>
      <div class="shop-focus" id="shopFocus" hidden></div>
      <div class="shop-hotspots" id="shopHotspots" hidden></div>
    </div>
    <div class="zoom-level" id="zoomLevel" aria-label="拡大率">100%</div>
  </section>
  <div class="side-panel">
    <p class="note"><span id="status">地図をタップして位置を指定</span><span class="source">会場図：<a href="https://www.beerkeyaki.jp/map/" target="_blank" rel="noopener">けやきひろばビール祭り公式サイト</a></span></p>
    <footer class="page-footer">
      <div class="footer-copy"><strong>この地図を開く</strong><a href="https://otkzh.github.io/keyaki-beer-where/">otkzh.github.io/keyaki-beer-where/</a></div>
      <a class="qr-link" href="https://otkzh.github.io/keyaki-beer-where/" aria-label="QRコードのリンクからこの地図を開く"><img src="share-qr.svg" width="112" height="112" alt="この地図を開くQRコード"></a>
    </footer>
  </div>
</main>
<section class="shop-panel" id="shopPanel" hidden aria-labelledby="shopPanelTitle">
  <header class="shop-panel-head"><div><span id="shopNumber"></span><h2 id="shopPanelTitle"></h2></div><button id="closeShop" aria-label="店舗情報を閉じる">×</button></header>
  <div class="shop-panel-body" id="shopPanelBody"></div>
</section>
<dialog class="shot-dialog" id="shotDialog" aria-labelledby="shotTitle">
  <header><h2 id="shotTitle">プレビュー</h2><button id="closeShot" aria-label="閉じる">×</button></header>
  <div class="shot-preview-wrap"><img class="shot-preview" id="shotPreview" alt="地図と待ち合わせ位置の画像"></div>
  <div class="shot-actions">
    <a id="downloadShot" download="keyaki-imakoko.png"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 18v3h16v-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"/></svg>保存</a>
    <button id="shareShot" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="6" cy="12" r="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="18" cy="19" r="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="m8 11 8-5M8 13l8 5" fill="none" stroke="currentColor" stroke-width="2"/></svg>共有</button>
  </div>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="app.js?v=11" defer></script>
</body>
</html>
